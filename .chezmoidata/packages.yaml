packages:
  mise:
    "aqua:FiloSottile/age": "1.3.2"
    "aqua:Kitware/CMake": "4.4.5"
    "aqua:git-lfs/git-lfs": "3.8.1"
    "aqua:jqlang/jq": "1.8.2"
    "aqua:twpayne/chezmoi": "2.72.0"
    bat: "0.26.1"
    bun: "1.4.2"
    fd: "10.5.0"
    fzf: "0.74.4"
    gh: "2.101.0"
    "github:skevetter/devpod": "0.26.3"
    go: "1.27.1"
    herdr: "0.9.1"
    k9s: "0.51.0"
    neovim: "0.12.5"
    "pipx:josephhaaga-clerk": "0.0.12"
    "pipx:git-filter-repo": "2.47.0"
    # Keep calendar tooling available without blocking applies while PyPI
    # dependency metadata is unstable. mise installs lazy tools on first use.
    "pipx:gcalcli":
      version: "4.5.1"
      lazy: true
      lazy_bins: [gcalcli]
    node: "26.10.0"
    "aqua:dalance/procs": "0.14.12"
    python: "3.14.7"
    ripgrep: "15.2.0"
    shellcheck: "0.11.0"
    starship: "1.26.0"
    stylua: "2.5.2"
    tealdeer: "1.9.0"
    uv: "0.12.17"

  mise_cloud:
    # azure-cli resolves to the pipx backend, which needs Python 3.10 or newer.
    azure-cli: "2.90.0"

  mise_kubernetes:
    "aqua:Azure/kubelogin": "0.2.19"
    kubectl: "1.37.0"

  mise_security:
    gitleaks: "8.30.1"

  mise_desktop:
    colima: "0.10.3"
    lima: "2.2.1"
    "pipx:mempalace": "3.10.0"

  mise_server:
    "cargo:tree-sitter-cli": "0.26.12"
    rust: "1.97.1"

  npm:
    "@josephhaaga/agent-profiler": "0.3.1"
    "@opencode/cli": "2.2.7"
    tokscale: "4.17.0"
    tree-sitter-cli: "0.27.0"

  # OpenCode owns the plugin cache; dotfiles own the exact package selection.
  opencode_plugins:
    agent_profiler: "0.4.1"

  # Rex publishes only snapshot builds until its first stable release.
  rex:
    channel: snapshot

  # Chrome Sync remains responsible for cross-device installation. This inventory
  # lets `chrome-extensions` audit the local Chrome profile. Missing Chrome Web
  # Store pages can be opened later with its explicit --install-missing option.
