  macos:
    taps:
      - asmvik/formulae
      # Whiteboard requires its publisher's tap; cask code is trusted explicitly.
      - devdotfast/tap
      # Scrawl requires its publisher's tap; cask code is trusted explicitly.
      - kitlangton/tap
    trusted_taps:
      - asmvik/formulae
      - kitlangton/tap
    window_manager_brews:
      - asmvik/formulae/skhd
