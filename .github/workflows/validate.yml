name: Validate dotfiles

on:
  pull_request:
  push:
    branches: [master]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install jq shellcheck gitleaks chezmoi uv
      - run: bash scripts/validate.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck zsh
      - run: sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash scripts/validate.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/container/Dockerfile -t dotfiles-v2 .
