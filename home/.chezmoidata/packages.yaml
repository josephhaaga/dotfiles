# Declarative package list. Edited by hand; consumed by
# dot_config/brew/Brewfile.tmpl and .chezmoiscripts/run_onchange_install-packages.sh.tmpl.
# Run `chezmoi apply` after changing this file to install/update packages.
packages:
  taps:
    - heroku/brew
    - asmvik/formulae
    - josephhaaga/dotfiles
    - textualize/homebrew

  brews:
    - asciinema
    - asciiquarium
    - bash
    - bat
    - cmake
    - cog
    - cowsay
    - duckdb
    - gnutls
    - ffmpeg
    - fswatch
    - frogmouth
    - gh
    - git-filter-repo
    - git-lfs
    - gnupg
    - go
    - herdr
    - jq
    - lolcat
    - mas
    - neovim
    - node
    - ponysay
    - redis
    - ripgrep
    - sops
    - shellcheck
    - gitleaks
    - tealdeer
    - tree
    - uv
    - wget
    - yarn
    - heroku/brew/heroku
    - asmvik/formulae/skhd
    - asmvik/formulae/yabai
    - anomalyco/tap/opencode
    - oven-sh/bun/bun
    - starship
    - gum
    - tmux
    - azure-cli
    - httpie
    - fd
    - charmbracelet/tap/crush
