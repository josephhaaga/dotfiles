    - claude
    - claude-code
    - codex-app
    - docker-desktop
    - granola
    - linear
    - loom
    - microsoft-teams
    - notion
    - slack
    - wispr-flow
    - obsidian
    - opencode-desktop

  # Only installed when the "work" machine prompt (see .chezmoi.toml.tmpl) is true.
  # Sybill (https://www.sybill.ai/) has no cask and must be installed manually.
  # Tribe Hub is a web app and needs no local install.
  work_casks:
    - zoom
