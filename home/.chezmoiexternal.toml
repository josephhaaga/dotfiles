# Third-party OpenCode skills stay outside Git. Pin each source and refresh
# only when this file changes or chezmoi is run with --refresh-externals.
[".config/opencode/skills/impeccable"]
    type = "archive"
    url = "https://github.com/pbakaus/impeccable/archive/refs/tags/skill-v4.3.1.tar.gz"
    exact = true
    stripComponents = 3
    include = ["*/.opencode/skills/impeccable/**"]

[".config/opencode/skills/graphify/SKILL.md"]
    type = "file"
    url = "https://raw.githubusercontent.com/Graphify-Labs/graphify/6478eb71237c86ee5fb6a35c702835e987ca445d/graphify/skill-opencode.md"

[".config/opencode/skills/retro/SKILL.md"]
